<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cozinha">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<title>Pedidos da Cozinha</title>
<style>
  :root {
    --bg: #111418; --card: #1c2128; --line: #2d333b; --text: #f2f4f7; --muted: #9aa4b2;
    --novo: #f5b301; --pronto: #2fb35a; --obs: #ff7a59;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px;
    flex-wrap: wrap; padding: 12px 16px; background: #0b0d10; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 1.5rem; flex: 1; }
  .status { font-size: .95rem; color: var(--muted); }
  .status b { color: var(--text); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--pronto); margin-right: 6px; }
  .dot.off { background: #d64545; }
  button { font: inherit; border: 0; border-radius: 10px; padding: 10px 14px; cursor: pointer;
    background: var(--line); color: var(--text); }
  button.alerta { background: var(--novo); color: #111; font-weight: 700; }
  .abas { display: flex; gap: 8px; padding: 12px 16px 0; }
  .abas button.ativo { background: var(--text); color: #111; font-weight: 700; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; padding: 16px; }
  .pedido { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 14px;
    display: flex; flex-direction: column; gap: 10px; }
  .pedido.novo { border-color: var(--novo); animation: pisca 1s ease-in-out 6; }
  @keyframes pisca { 50% { box-shadow: 0 0 0 6px rgba(245,179,1,.35); } }
  .topo { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .cliente { font-size: 1.5rem; font-weight: 800; line-height: 1.15; word-break: break-word; }
  .num { color: var(--muted); font-size: .9rem; white-space: nowrap; }
  .tempo { font-size: .95rem; color: var(--muted); }
  .tempo.atrasado { color: var(--obs); font-weight: 700; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  li { display: flex; gap: 10px; font-size: 1.3rem; align-items: baseline; }
  .qtd { min-width: 2.4em; font-weight: 800; color: var(--novo); }
  .obs { background: rgba(255,122,89,.15); color: var(--obs); border-radius: 10px; padding: 8px 10px; font-size: 1.1rem; font-weight: 600; }
  .pag { color: var(--muted); font-size: .9rem; }
  .pedido button.feito { background: var(--pronto); color: #fff; font-weight: 700; font-size: 1.1rem; padding: 14px; }
  .pedido.concluido { opacity: .55; }
  .pedido.concluido button.feito { background: var(--line); }
  .vazio { grid-column: 1 / -1; text-align: center; color: var(--muted); font-size: 1.3rem; padding: 60px 16px; }
  button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

  /* ---- celular ---- */
  @media (max-width: 600px) {
    header { padding: calc(10px + env(safe-area-inset-top)) 12px 10px; gap: 8px; }
    h1 { font-size: 1.2rem; }
    .status { order: 3; width: 100%; font-size: .85rem; }
    header button { padding: 8px 12px; font-size: .95rem; }
    #tela { display: none; }
    .abas { position: sticky; top: var(--alt-topo, 84px); z-index: 4; background: var(--bg); padding: 10px 12px; }
    .abas button { flex: 1; padding: 12px; font-size: 1rem; }
    main { grid-template-columns: 1fr; gap: 12px; padding: 4px 12px calc(16px + env(safe-area-inset-bottom)); }
    .pedido { padding: 14px; border-radius: 14px; }
    .cliente { font-size: 1.4rem; }
    li { font-size: 1.2rem; }
    .pedido button.feito { padding: 16px; font-size: 1.15rem; }
  }
</style>
</head>
<body>
<header>
  <h1>🍳 Pedidos da Cozinha</h1>
  <span class="status"><span class="dot" id="dot"></span><span id="status">Conectando…</span></span>
  <button id="som" class="alerta">🔔 Ativar som</button>
  <button id="tela">⛶ Tela cheia</button>
</header>
<div class="abas">
  <button id="abaFila" class="ativo">A fazer (<span id="nFila">0</span>)</button>
  <button id="abaProntos">Prontos (<span id="nProntos">0</span>)</button>
</div>
<main id="lista"><div class="vazio">Carregando pedidos…</div></main>

<script>
// ====== CONFIGURAÇÃO ======
const PLANILHA = '1-i3Qt5g155rNmAX574CoNc8xPX_jcvuUG1gtTVlaUJI';
const ABA_GID = '1512056425';
const ATUALIZAR_A_CADA = 5;     // segundos
const ATRASO_MINUTOS = 20;      // tempo para marcar o pedido em vermelho
// Link do script da planilha (termina em /exec). Com ele, o "Pronto" aparece em todos os aparelhos.
// Vazio = o "Pronto" fica salvo só no próprio aparelho.
const SCRIPT_URL = ''; // desligado até o script ser atualizado (versão "Painel Cozinha")
// const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz219mJqCS-MUp6pLxinCY5qrvLj_DYQSQ1NCy6ZlySfl880FsnSGfV9eK3dQQNkZxm3A/exec';
// Colunas da planilha: A Chave (não usada) | B Nome cliente | C Item | D Qtde | E Valor unit | F Valor total | G Pagamento | H Obs
// ==========================

const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const ler = (k, padrao) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? padrao; } catch (e) { return padrao; } };

// "Pronto" = id do pedido -> assinatura do conteúdo quando foi marcado.
// Se alguém mudar o pedido depois (novo item, nova obs), a assinatura muda e ele volta para a fila.
let prontosLocal = ler('cozinha_prontos2', {});  // modo só-neste-aparelho
let prontosPlanilha = {};                        // modo compartilhado (aba "Cozinha" da planilha)
let pendentes = {};                              // cliques ainda sendo gravados: id -> { pronto, ate }
let vistoEm = ler('cozinha_visto', {});        // chave -> horário em que apareceu
let assinaturas = {};                           // chave -> conteúdo, para detectar mudanças
let primeiraCarga = true;
let somAtivo = false;
let aba = ler('cozinha_aba', 'fila');
let pedidos = [];
let ultimaOk = 0;

// ---- leitura da planilha (JSONP, funciona em qualquer hospedagem) ----
let seq = 0;
function jsonp(montarUrl, limiteMs = 15000) {
  return new Promise((ok, falha) => {
    const cb = 'cb' + Date.now() + '_' + (seq++);
    const s = document.createElement('script');
    const tempo = setTimeout(() => { limpar(); falha(new Error('tempo esgotado')); }, limiteMs);
    const limpar = () => { clearTimeout(tempo); window[cb] = () => {}; s.remove(); };
    window[cb] = (resp) => { limpar(); ok(resp); };
    s.onerror = () => { limpar(); falha(new Error('erro de rede')); };
    s.src = montarUrl(cb);
    document.body.appendChild(s);
  });
}
const gviz = (filtro, cb) => `https://docs.google.com/spreadsheets/d/${PLANILHA}/gviz/tq?${filtro}&headers=1&tqx=responseHandler:${cb}&_=${Date.now()}`;

async function buscar() {
  try {
    const [resp] = await Promise.all([
      jsonp(cb => gviz('gid=' + ABA_GID, cb)),
      SCRIPT_URL ? buscarProntos() : null,
    ]);
    if (resp && resp.status === 'ok') processar(resp.table); else erro();
  } catch (e) { erro(); }
}

async function buscarProntos() {
  try {
    const resp = await jsonp(cb => gviz('sheet=' + encodeURIComponent('Painel Cozinha'), cb));
    if (!resp || resp.status !== 'ok') return;
    const col = resp.table.cols[0];
    if (!col || !/ID PEDIDO/i.test(col.label || '')) return;   // aba "Painel Cozinha" ainda não existe
    const mapa = {};
    resp.table.rows.forEach(l => { const id = celula(l, 0); if (id) mapa[id] = celula(l, 1); });
    prontosPlanilha = mapa;
    // clique já confirmado pela planilha: não precisa mais segurar
    Object.keys(pendentes).forEach(id => {
      const p = pedidos.find(x => x.id === id);
      if (!pendentes[id].gravado || !p) return;
      if ((mapa[id] === p.assin) === pendentes[id].pronto) delete pendentes[id];
    });
  } catch (e) { /* tenta de novo na próxima rodada */ }
}

function assinatura(p) {
  const t = JSON.stringify([p.itens, p.obs]);
  let h = 5381;
  for (let i = 0; i < t.length; i++) h = ((h * 33) ^ t.charCodeAt(i)) >>> 0;
  return 'h' + h.toString(36);
}

function estaPronto(p) {
  const pend = pendentes[p.id];
  if (pend && pend.ate > Date.now()) return pend.pronto;
  const marcado = (SCRIPT_URL ? prontosPlanilha : prontosLocal)[p.id];
  return !!marcado && marcado === p.assin;
}

function celula(linha, i) {
  const c = linha.c && linha.c[i];
  if (!c) return '';
  const v = c.f != null ? c.f : c.v;
  return v == null ? '' : String(v).trim();
}

function processar(tabela) {
  ultimaOk = Date.now();
  // Um pedido = linhas seguidas com o mesmo NOME CLIENTE.
  // Linha sem nome (mas com item) é mais um item do pedido de cima.
  const mapa = new Map();
  let atual = null, nomeAtual = '';
  tabela.rows.forEach((linha, idx) => {
    const cliente = celula(linha, 1), item = celula(linha, 2);
    if (!item && !cliente) { atual = null; nomeAtual = ''; return; }
    const nome = cliente.toLowerCase().replace(/\s+/g, ' ');
    if (!atual || (nome && nome !== nomeAtual)) {
      const id = (idx + 2) + '|' + (nome || 'sem-nome');   // linha da planilha + nome
      atual = { id, cliente, itens: [], obs: [], pag: '', ordem: idx };
      mapa.set(id, atual);
      nomeAtual = nome;
    }
    const p = atual;
    if (item) p.itens.push({ item, qtd: celula(linha, 3) || '1' });
    const obs = celula(linha, 7);
    if (obs && !p.obs.includes(obs)) p.obs.push(obs);
    if (!p.pag) p.pag = celula(linha, 6);
    if (!p.cliente) p.cliente = cliente;
  });

  const agora = Date.now();
  let chegouNovo = false;
  const novasAssinaturas = {};
  pedidos = [...mapa.values()];
  pedidos.forEach(p => {
    p.assin = assinatura(p);
    novasAssinaturas[p.id] = p.assin;
    if (!vistoEm[p.id]) vistoEm[p.id] = agora;
    const mudou = assinaturas[p.id] !== undefined && assinaturas[p.id] !== p.assin;
    const novo = assinaturas[p.id] === undefined && !primeiraCarga;
    if (novo || mudou) { p.destaque = true; chegouNovo = true; }
  });
  // esquece pedidos que saíram da planilha
  Object.keys(vistoEm).forEach(k => { if (!mapa.has(k)) delete vistoEm[k]; });
  Object.keys(prontosLocal).forEach(k => { if (!mapa.has(k)) delete prontosLocal[k]; });
  assinaturas = novasAssinaturas;
  primeiraCarga = false;
  guardar('cozinha_visto', vistoEm); guardar('cozinha_prontos2', prontosLocal);

  if (chegouNovo) apitar();
  desenhar();
}

function erro() {
  document.getElementById('dot').classList.add('off');
  document.getElementById('status').innerHTML = '<b>Sem conexão</b> com a planilha — tentando de novo…';
}

// ---- tela ----
const esc = (t) => String(t).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

function minutos(id) { return Math.floor((Date.now() - (vistoEm[id] || Date.now())) / 60000); }

function desenhar() {
  const fila = pedidos.filter(p => !estaPronto(p));
  const feitos = pedidos.filter(p => estaPronto(p));
  document.getElementById('nFila').textContent = fila.length;
  document.getElementById('nProntos').textContent = feitos.length;
  document.getElementById('abaFila').classList.toggle('ativo', aba === 'fila');
  document.getElementById('abaProntos').classList.toggle('ativo', aba === 'prontos');

  const mostrar = aba === 'fila' ? fila : feitos.slice().reverse();
  const lista = document.getElementById('lista');
  if (!mostrar.length) {
    lista.innerHTML = `<div class="vazio">${aba === 'fila' ? 'Nenhum pedido na fila 🎉<br><small>Os pedidos aparecem aqui assim que forem lançados na planilha.</small>' : 'Nenhum pedido pronto ainda.'}</div>`;
  } else {
    lista.innerHTML = mostrar.map(p => {
      const min = minutos(p.id);
      const feito = estaPronto(p);
      return `<article class="pedido ${p.destaque ? 'novo' : ''} ${feito ? 'concluido' : ''}">
        <div class="topo"><div class="cliente">${esc(p.cliente || 'Sem nome')}</div></div>
        <div class="tempo ${!feito && min >= ATRASO_MINUTOS ? 'atrasado' : ''}">⏱ ${min < 1 ? 'agora' : 'há ' + min + ' min'}</div>
        <ul>${p.itens.map(i => `<li><span class="qtd">${esc(i.qtd)}x</span><span>${esc(i.item)}</span></li>`).join('')}</ul>
        ${p.obs.length ? `<div class="obs">⚠ ${p.obs.map(esc).join('<br>⚠ ')}</div>` : ''}
        ${p.pag ? `<div class="pag">💳 ${esc(p.pag)}</div>` : ''}
        <button class="feito" data-id="${esc(p.id)}">${feito ? '↩ Voltar para a fila' : '✔ Pronto'}</button>
      </article>`;
    }).join('');
  }
  pedidos.forEach(p => p.destaque = false);

  document.getElementById('dot').classList.remove('off');
  const hora = new Date(ultimaOk).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  document.getElementById('status').innerHTML = `Atualizado <b>${hora}</b>`;
}

document.getElementById('lista').addEventListener('click', (e) => {
  const b = e.target.closest('button.feito');
  if (!b) return;
  const p = pedidos.find(x => x.id === b.dataset.id);
  if (!p) return;
  const marcar = !estaPronto(p);
  if (!SCRIPT_URL) {
    if (marcar) prontosLocal[p.id] = p.assin; else delete prontosLocal[p.id];
    guardar('cozinha_prontos2', prontosLocal);
    desenhar();
    return;
  }
  // mostra na hora e grava na planilha em segundo plano
  pendentes[p.id] = { pronto: marcar, ate: Date.now() + 60000 };
  desenhar();
  gravarPronto(p, marcar);
});

async function gravarPronto(p, marcar, tentativa = 1) {
  const q = `id=${encodeURIComponent(p.id)}&pronto=${marcar ? 1 : 0}&assin=${encodeURIComponent(p.assin)}`;
  try {
    const resp = await jsonp(cb => `${SCRIPT_URL}?${q}&callback=${cb}`, 20000);
    if (!resp || !resp.ok) throw new Error(resp && resp.erro);
    // gravou; segura o estado na tela até a leitura da planilha confirmar (máx. 60 s)
    pendentes[p.id] = { pronto: marcar, ate: Date.now() + 60000, gravado: true };
  } catch (e) {
    if (tentativa < 3) return gravarPronto(p, marcar, tentativa + 1);
    delete pendentes[p.id];
    desenhar();
    alert(`Não consegui salvar o pedido de ${p.cliente || 'sem nome'}. Confira a internet e toque de novo.`);
  }
}
document.getElementById('abaFila').onclick = () => { aba = 'fila'; guardar('cozinha_aba', aba); desenhar(); };
document.getElementById('abaProntos').onclick = () => { aba = 'prontos'; guardar('cozinha_aba', aba); desenhar(); };

// ---- som de aviso ----
let audio;
function apitar() {
  try { if (navigator.vibrate && navigator.userActivation?.hasBeenActive) navigator.vibrate([300, 150, 300]); } catch (e) {}
  if (!somAtivo || !audio) return;
  const t = audio.currentTime;
  [0, 0.25, 0.5].forEach((d, i) => {
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = 'sine'; o.frequency.value = i === 2 ? 1320 : 880;
    g.gain.setValueAtTime(0.0001, t + d);
    g.gain.exponentialRampToValueAtTime(0.6, t + d + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.2);
    o.connect(g).connect(audio.destination); o.start(t + d); o.stop(t + d + 0.22);
  });
}
const botaoSom = document.getElementById('som');
botaoSom.onclick = () => {
  if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
  audio.resume();
  somAtivo = !somAtivo;
  botaoSom.textContent = somAtivo ? '🔔 Som ligado' : '🔕 Ativar som';
  botaoSom.classList.toggle('alerta', !somAtivo);
  if (somAtivo) apitar();
  manterTelaLigada();
};

// ---- tela cheia e tela sempre ligada ----
document.getElementById('tela').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.();
  manterTelaLigada();
};
let trava;
async function manterTelaLigada() {
  try { if ('wakeLock' in navigator && !trava) { trava = await navigator.wakeLock.request('screen'); trava.addEventListener('release', () => trava = null); } } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { manterTelaLigada(); buscar(); } });

// mantém as abas grudadas logo abaixo do cabeçalho no celular
function ajustarTopo() { document.documentElement.style.setProperty('--alt-topo', document.querySelector('header').offsetHeight + 'px'); }
window.addEventListener('resize', ajustarTopo); ajustarTopo();

buscar();
setInterval(buscar, ATUALIZAR_A_CADA * 1000);
setInterval(() => { if (pedidos.length) desenhar(); }, 30000); // atualiza os "há X min"
</script>
</body>
</html>
